  <main>
    <article>
    	<h1>Редактирование данных пользоваетля <span style="text-decoration: underline;">ivan001</span></h1>	
	    <form action="/editor/saveUser" method="post">  
	      <div class="entering-param">
	      	<p>Имя</p>
					<input type="text" id="name" name="name" value="Иван">
	      </div>
	      
				<div class="entering-param">
					<p>Фамилия</p>
					<input type="text" id="surname" name="surname" value="Иванов">
				</div>
	      
				<div class="entering-param">
					<p>Приоритет</p>
					<input type="text" id="priority" name="priority" value="5">
				</div>
	      
				<div class="entering-param">
					<p>Время вполнения задач в минутах</p>
					<input type="text" id="minutesToProcessTask" name="minutesToProcessTask" value="120">
				</div>
	  
	      <div class="buttons">
	      	<div>
						<input type="submit" name="save" value="Сохранить" class="button">
					</div>
	
		      <a href="/editor/taskSamples">
		        <button type="button" class="button">Отменить</button>
		      </a>
	      </div>
	    </form>
    </article>
