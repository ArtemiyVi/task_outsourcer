<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/curtain-pages/editing-task-sample.css">
  <link rel="shortcut icon" href="image/icon2.svg" type="image/x-icon">
  <script type="text/javascript" src="/js/script.js"></script>
  <title>Task Outsourcer - Editing Task Sample #1</title>
</head>

<body>
  <header>
    <a href="/index-simple-user.html" class="app-logo">
      <img src="image/icon2.svg" alt="" class="logo-img">
      Task Outsourcer
    </a>
    <ul class="nav-menu">
      <li class="nav-link-container">
        <a href="/choosing-task.html" class="nav-link">Выбор задачи</a>
      </li>
      <li class="nav-link-container">
        <a href="/personal-cabinet.html" class="nav-link">Личный кабинет</a>
      </li>
      <li class="nav-link-container">
        <a href="/control-panel.html" class="nav-link">Контрольная панель</a>
      </li>
      <li class="nav-link-container">
        <a href="/editor.html" class="nav-link">Редактор</a>
      </li>
    </ul>
  </header>

  <main>
    <article>
      <h1>Редактирование шаблона задачи #1</h1>


      <form action="/editor/taskSamples/edit" method="post" enctype="multipart/form-data">

        <div class="other">
          <div class="entering-param">
            <label>Название:</label>
            <input type="text" style="width:400px;" id="name" name="name"
              value="Рендер картинки в Blender. Движок Cycles">
          </div>

          <div class="entering-param">
            <label>Описание:</label>
            <textarea type="text" class="task-description" id="description" name="description">Выполняет рендер картинки в 3D-редакторе Blender на движке Cycles с возможностью задания итоговогоразрешения по вертикали и горизонтали картинки и количества циклов обработки.</textarea>
          </div>

          <div class="entering-param">
            <label>Шаблон запускающей команды:</label>
            <input type="text" id="launchCommandTemplate" name="launchCommandTemplate"
              value="blender -b -P &quot;%s&quot; -- &quot;%s&quot; %s">
          </div>

          <div class="entering-param">
            <label>Задание нового скрипта:</label>
            <div class="my-button">
              <input type="file" id="file-button" name="scriptFile">
              <div class="text">Приложить файл</div>
            </div>
          </div>

          <div class="download-script">
            <label>Скачать текущий скрипт:</label>
            <a href="/download/taskSampleScript/1">render_image.py</a>
          </div>
        </div>

        <h2 style="align-self: center;">Параметры</h2>
        <table class="param-table">
          <thead>
            <tr>
              <th>Тип</th>
              <th>Имя</th>
              <th>Описание</th>
              <th>Ограничения</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="type-cell">INTEGER</td>
              <td>
                <input type="text" value="Горизонтальное разрешение">
              </td>
              <td>
                <textarea type="text" class="param-description" placeholder="Добавьте описание">Задаёт горизонтальное разрешение итогового изображения.</textarea>
              </td>
              <td>
                <div class="constraints">
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Мин:</label>
                    <input type="text" value="1">
                  </div>
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Макс:</label>
                    <input type="text" value="10000">
                  </div>

                  <!-- <p class="error">
                    Минимальное ограничение должно быть меньше максимального
                  </p> -->
                </div>
              </td>
              <td>
                <button type="submit" name="removeParam" formaction="" class="button remove">X</button>
              </td>
            </tr>

            <tr>
              <td class="type-cell">INTEGER</td>
              <td>
                <input type="text" value="Вертикальное разрешение">
              </td>
              <td>
                <textarea type="text" class="param-description"
                  placeholder="Добавьте описание">Задаёт вертикальное разрешение итогового изображения.</textarea>
              </td>
              <td>
                <div class="constraints">
                  <div class="entering-constraint">
                    <label class="constraint-name">Мин:</label>
                    <input type="text" value="1">
                  </div>

                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Макс:</label>
                    <input type="text" value="10000">
                  </div>

                  <!-- <p class="error">
                    Минимальное ограничение должно быть меньше максимального
                  </p> -->
                </div>


              </td>
              <td>
                <button type="submit" name="removeParam" formaction="" class="button remove">X</button>
              </td>

            </tr>
            <tr>
              <td class="type-cell">FILE</td>
              <td>
                <input type="text" value="blender-проект">
              </td>
              <td>
                <textarea type="text" class="param-description" placeholder="Добавьте описание">Blender-проект, на основе которого будет происходить рендер изображения.</textarea>
              </td>
              <td>
                <div class="constraints">
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Тип файла:</label>
                    <input type="text" value="blend">
                  </div>
                </div>
              </td>
              <td>
                <button type="submit" name="removeParam" formaction="" class="button remove">X</button>
              </td>

            </tr>
            <tr>
              <td class="type-cell">STRING</td>
              <td>
                <input type="text" value="Название итоговой картинки">
              </td>
              <td>
                <textarea type="text" class="param-description" placeholder="Добавьте описание"></textarea>
              </td>
              <td>
                <div class="constraints">
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">RegEx:</label>
                    <input type="text" value="">
                  </div>
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Пример:</label>
                    <input type="text" value="">
                  </div>

                  <!-- <p class="error">
                    Неверное регулярное выражение
                  </p> -->
                </div>

              </td>
              <td>
                <button type="submit" name="removeParam" formaction="" class="button remove">X</button>
              </td>

            </tr>
            <tr>
              <td class="type-cell">INTEGER</td>
              <td><input type="text" value="Samples"></td>
              <td>
                <textarea type="text" class="param-description" placeholder="Добавьте описание">Количество циклов обработки</textarea>
              </td>
              <td>
                <div class="constraints">
                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Мин:</label>
                    <input type="text" value="1" class="constraint-value">
                  </div>

                  <div class="entering-constraint">
                    <label for="" class="constraint-name">Макс:</label>
                    <input type="text" value="1000">
                  </div>

                  <!-- <p class="error">
                    Минимальное ограничение должно быть меньше максимального
                  </p> -->
                </div>
              </td>
              <td>
                <button type="submit" name="removeParam" formaction="" class="button remove">X</button>
              </td>

            </tr>
          </tbody>
        </table>


        <div class="adding-param">
          <select id="addingType" name="addingType">
            <option value="INTEGER">INTEGER</option>
            <option value="STRING">STRING</option>
            <option value="FILE">FILE</option>
          </select>
          <input type="submit" name="addParam" value="Добавить параметр" class="button">
        </div>

        <div class="buttons">
          <input type="submit" name="save" value="Сохранить" class="button">
          <a href="/editor/taskSamples">
            <button type="button" class="button">Отмена</button>
          </a>
        </div>
      </form>
    </article>
  </main>

  <footer>
    Контактная информация:
    <div class="footer_info">
      <a class="email_info">
        Email
      </a>
    </div>
    <div class="footer_info">
      <a href="https://t.me/richihnok" target="_blank" class="tg-info">
        Telegram
      </a>
    </div>
    <div class="footer_info">
      <a href="https://github.com/RichiHnok" target="_blank" class="github-info">
        Github
      </a>
    </div>
  </footer>

</body>

</html>
