<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" type="text/css" href="/css/styles.css">
  <link rel="shortcut icon" href="image/icon2.svg" type="image/x-icon">
  <script type="text/javascript" src="/js/script.js"></script>
  <title>Task Outsourcer</title>
</head>

<body>
	<header>
		<a href="/index-simple-user.html" class="app-logo">
			<img src="image/icon2.svg" alt="" class="logo-img">
			Task Outsourcer
		</a>
		<ul class="nav-menu">
			<li class="nav-link-container">
				<a href="/choosing-task.html" class="nav-link">Выбор задачи</a>
			</li>
			<li class="nav-link-container">
				<a href="/personal-cabinet.html" class="nav-link">Личный кабинет</a>
			</li>
			<li class="nav-link-container">
				<a href="/control-panel.html" class="nav-link">Контрольная панель</a>
			</li>
			<li class="nav-link-container">
				<a href="/editor.html" class="nav-link">Редактор</a>
			</li>
		</ul>
	</header>


	<main>
		<article>
			<h2>Создание нового шаблона задачи</h2>
		
			<form action="/editor/taskSamples/edit" method="post" enctype="multipart/form-data">
				<input type="hidden" id="id" name="id" value="">
		
				<span>Название:</span>
				<br>
				<input type="text" style="width:400px;" id="name" name="name" value="">
				<br>
				<span>Описание:</span>
				<br>
				<textarea type="text" style="height:120px;width:400px;resize:none" id="description" name="description"></textarea>
				<br>
				<br>
		
				<span>Шаблон запускающей команды:</span>
				<input type="text" id="launchCommandTemplate" name="launchCommandTemplate" value="">
				<br>
		
				<span>Задание скрипта:</span>
				<input type="file" id="scriptFile" name="scriptFile">
		
				<input type="hidden" id="scriptFileName" name="scriptFileName" value="">
		
				<br>
				<br>
		
				<span>Параметры:</span>
				<br>
		
				<div>
					<p>Нет параметров</p>
				</div>
		
				<select id="addingType" name="addingType">
					<option value="INTEGER">INTEGER</option>
					<option value="STRING">STRING</option>
					<option value="FILE">FILE</option>
				</select>
				<input type="submit" name="addParam" value="Добавить параметр">
				<br>
				<br>
				<input type="submit" name="save" value="Сохранить">
			</form>
			<a href="/editor/taskSamples">
				<button type="button">Отмена</button>
			</a>
		</article>
	</main>

	<footer>
		Контактная информация:
		<div class="footer_info">
			<a class="email_info">
				Email
			</a>
		</div>
		<div class="footer_info">
			<a href="https://t.me/richihnok" target="_blank" class="tg-info">
				Telegram
			</a>
		</div>
		<div class="footer_info">
			<a href="https://github.com/RichiHnok" target="_blank" class="github-info">
				Github
			</a>
		</div>
	</footer>

</body>

</html>
